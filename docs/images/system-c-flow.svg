<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 190" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="950" height="190" fill="#f6f8fa"/>
  <text x="475" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a202c">System C: Deterministic Lookup</text>

  <!-- Question -->
  <rect x="20" y="60" width="120" height="70" rx="10" fill="#eef2f7" stroke="#4a5568" stroke-width="1.5"/>
  <text x="80" y="101" text-anchor="middle" font-size="14" fill="#1a202c">Question</text>

  <!-- Classify -->
  <rect x="170" y="60" width="230" height="70" rx="10" fill="#e7f0fd" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="285" y="92" text-anchor="middle" font-size="14" fill="#1a202c">Claude Classifies</text>
  <text x="285" y="112" text-anchor="middle" font-size="12" fill="#41546b">jurisdiction plus theme</text>

  <!-- Cylinder: static lookup table -->
  <rect x="480" y="65" width="120" height="65" fill="#fff6e0"/>
  <ellipse cx="540" cy="65" rx="60" ry="12" fill="#fff6e0" stroke="#c98a1c" stroke-width="1.5"/>
  <ellipse cx="540" cy="130" rx="60" ry="12" fill="#fff6e0" stroke="#c98a1c" stroke-width="1.5"/>
  <line x1="480" y1="65" x2="480" y2="130" stroke="#c98a1c" stroke-width="1.5"/>
  <line x1="600" y1="65" x2="600" y2="130" stroke="#c98a1c" stroke-width="1.5"/>
  <text x="540" y="97" text-anchor="middle" font-size="12" fill="#1a202c">Static lookup</text>
  <text x="540" y="113" text-anchor="middle" font-size="12" fill="#1a202c">table</text>

  <!-- Answer -->
  <rect x="700" y="60" width="220" height="70" rx="10" fill="#eafaf0" stroke="#2f9e5c" stroke-width="1.5"/>
  <text x="810" y="101" text-anchor="middle" font-size="14" fill="#1a202c">Answer + Citation</text>

  <!-- Arrows -->
  <line x1="140" y1="95" x2="166" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowC)"/>
  <line x1="400" y1="95" x2="476" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowC)"/>
  <line x1="604" y1="95" x2="696" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowC)"/>
</svg>
