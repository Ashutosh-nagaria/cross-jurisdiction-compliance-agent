<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 190" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="190" fill="#f6f8fa"/>
  <text x="540" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a202c">System A: Baseline Retrieval Augmented Generation</text>

  <!-- Question -->
  <rect x="20" y="60" width="120" height="70" rx="10" fill="#eef2f7" stroke="#4a5568" stroke-width="1.5"/>
  <text x="80" y="101" text-anchor="middle" font-size="14" fill="#1a202c">Question</text>

  <!-- Embed -->
  <rect x="170" y="60" width="200" height="70" rx="10" fill="#e7f0fd" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="270" y="92" text-anchor="middle" font-size="14" fill="#1a202c">Embed Question</text>
  <text x="270" y="112" text-anchor="middle" font-size="12" fill="#41546b">(Voyage voyage-law-2)</text>

  <!-- Vector search -->
  <rect x="400" y="60" width="190" height="70" rx="10" fill="#e7f0fd" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="495" y="92" text-anchor="middle" font-size="14" fill="#1a202c">Vector Search</text>
  <text x="495" y="112" text-anchor="middle" font-size="12" fill="#41546b">(MongoDB Atlas)</text>

  <!-- Generate -->
  <rect x="620" y="60" width="230" height="70" rx="10" fill="#e7f0fd" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="735" y="92" text-anchor="middle" font-size="14" fill="#1a202c">Claude Generates Answer</text>
  <text x="735" y="112" text-anchor="middle" font-size="12" fill="#41546b">(from retrieved chunks)</text>

  <!-- Answer -->
  <rect x="880" y="60" width="180" height="70" rx="10" fill="#eafaf0" stroke="#2f9e5c" stroke-width="1.5"/>
  <text x="970" y="101" text-anchor="middle" font-size="14" fill="#1a202c">Answer + Citation</text>

  <!-- Arrows -->
  <line x1="140" y1="95" x2="166" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <line x1="370" y1="95" x2="396" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <line x1="590" y1="95" x2="616" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <line x1="850" y1="95" x2="876" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowA)"/>
</svg>
