<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 230" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1340" height="230" fill="#f6f8fa"/>
  <text x="670" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a202c">Chain of Custody: LangGraph Agent</text>

  <!-- Question -->
  <rect x="20" y="60" width="130" height="70" rx="10" fill="#eef2f7" stroke="#4a5568" stroke-width="1.5"/>
  <text x="85" y="101" text-anchor="middle" font-size="14" fill="#1a202c">Question</text>

  <!-- Router -->
  <rect x="220" y="60" width="170" height="70" rx="10" fill="#e7f0fd" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="305" y="92" text-anchor="middle" font-size="14" fill="#1a202c">Router Node</text>
  <text x="305" y="112" text-anchor="middle" font-size="12" fill="#41546b">identify jurisdiction</text>

  <!-- Retrieval -->
  <rect x="460" y="60" width="180" height="70" rx="10" fill="#e7f0fd" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="550" y="92" text-anchor="middle" font-size="14" fill="#1a202c">Retrieval Node</text>
  <text x="550" y="112" text-anchor="middle" font-size="12" fill="#41546b">MongoDB Atlas search</text>

  <!-- Extraction -->
  <rect x="710" y="60" width="180" height="70" rx="10" fill="#e7f0fd" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="800" y="92" text-anchor="middle" font-size="14" fill="#1a202c">Extraction Node</text>
  <text x="800" y="112" text-anchor="middle" font-size="12" fill="#41546b">Claude pulls fact</text>

  <!-- Verification -->
  <rect x="960" y="60" width="180" height="70" rx="10" fill="#e7f0fd" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="1050" y="92" text-anchor="middle" font-size="14" fill="#1a202c">Verification Node</text>
  <text x="1050" y="112" text-anchor="middle" font-size="12" fill="#41546b">code checks vs source</text>

  <!-- Human approval diamond -->
  <polygon points="1240,45 1310,95 1240,145 1170,95" fill="#fff6e0" stroke="#c98a1c" stroke-width="1.5"/>
  <text x="1240" y="91" text-anchor="middle" font-size="13" fill="#1a202c">Human</text>
  <text x="1240" y="106" text-anchor="middle" font-size="13" fill="#1a202c">Approval</text>

  <!-- Final answer -->
  <rect x="1240" y="180" width="80" height="1" fill="none"/>
  <rect x="1170" y="185" width="150" height="0" fill="none"/>

  <!-- Arrows along main row -->
  <line x1="150" y1="95" x2="216" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="390" y1="95" x2="456" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="640" y1="95" x2="706" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="890" y1="95" x2="956" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="1140" y1="95" x2="1166" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Approved path, straight down from diamond to a final answer box below it -->
  <rect x="1175" y="180" width="130" height="40" rx="10" fill="#eafaf0" stroke="#2f9e5c" stroke-width="1.5"/>
  <text x="1240" y="205" text-anchor="middle" font-size="13" fill="#1a202c">Final Answer</text>
  <line x1="1240" y1="145" x2="1240" y2="176" stroke="#2f9e5c" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="1258" y="165" font-size="11" fill="#2f9e5c">Approved</text>

  <!-- Rejected path, loops back to Extraction node -->
  <path d="M1200,120 C1050,175 900,175 800,134" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="990" y="188" text-anchor="middle" font-size="11" fill="#c0392b">Rejected, back to Extraction</text>
</svg>
